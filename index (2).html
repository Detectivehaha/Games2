<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Элементы 1–53</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6fb;--card:#fff;--tx:#18202e;--mut:#6b7587;--ac:#2a7de1;--bd:#dfe4ee;--ok:#2e9e5b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141c;--card:#1b2230;--tx:#eef1f7;--mut:#93a0b8;--ac:#5aa2f5;--bd:#2a3347;--ok:#4cc27f}}
:root[data-theme="dark"]{--bg:#10141c;--card:#1b2230;--tx:#eef1f7;--mut:#93a0b8;--ac:#5aa2f5;--bd:#2a3347;--ok:#4cc27f}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
.bar{display:flex;gap:8px;padding:12px}
.bar button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:14px}
.bar button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.scr{display:none}.scr.on{display:block}
.prog{text-align:center;color:var(--mut);font-size:14px;margin-top:6px}
.stage{perspective:900px;display:flex;justify-content:center;margin:22px 16px 10px}
.card{width:100%;max-width:340px;height:300px;position:relative;transform-style:preserve-3d;transition:transform .6s}
.card.f{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--bd);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.12)}
.front{font:inherit;color:var(--ac);font-size:110px;font-weight:700;cursor:pointer}
.back{transform:rotateY(180deg)}
.back .l{font-size:12px;color:var(--mut);margin-top:12px}
.back .v{font-size:22px;font-weight:600}
.hint{text-align:center;color:var(--mut);font-size:13px;margin:0 16px}
.main{display:block;margin:18px auto 0;width:calc(100% - 32px);max-width:340px;padding:14px;border-radius:14px;border:0;background:var(--ac);color:#fff;font:inherit;font-size:17px;font-weight:600}
.main.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.res{text-align:center;padding:50px 16px 0}
.res .n{font-size:64px;font-weight:700;color:var(--ok)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px;padding:0 12px 230px}
.t{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px 0 8px;text-align:center;font:inherit;color:inherit}
.t small{display:block;font-size:10px;color:var(--mut)}
.t b{font-size:22px}
.t.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
#panel{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);border-radius:18px 18px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(0,0,0,.15);display:none}
#panel.on{display:block}
.top{display:flex;align-items:center;gap:14px}
.big{font-size:44px;font-weight:700;color:var(--ac);min-width:64px;text-align:center}
.say{font-size:20px;font-weight:600}
.lbl{font-size:12px;color:var(--mut)}
.sp{margin-left:auto;background:var(--ac);color:#fff;border:0;border-radius:50%;width:44px;height:44px;font-size:20px}
.row{margin-top:10px;font-size:16px}
.row span{color:var(--mut);font-size:12px;display:block}
</style>
</head>
<body>
<div class="bar"><button id="bq" class="on">Тест</button><button id="bl">Все элементы</button></div>

<div id="quiz" class="scr on">
  <div class="prog" id="prog"></div>
  <div class="stage"><div class="card" id="card">
    <button class="face front" id="front">H</button>
    <div class="face back">
      <div class="lbl">Читается</div><div class="v" id="bSay"></div>
      <div class="l">Что означает</div><div class="v" id="bNm"></div>
      <div class="l">Валентность</div><div class="v" id="bVal"></div>
    </div>
  </div></div>
  <p class="hint" id="hint">Знаете элемент — нажмите на него. Не знаете — кнопка внизу.</p>
  <button class="main alt" id="act">Не знаю</button>
</div>

<div id="result" class="scr">
  <div class="res"><div class="lbl">Вы отгадали</div><div class="n" id="score"></div>
  <p class="hint" id="msg"></p></div>
  <button class="main" id="again">Пройти заново</button>
  <button class="main alt" id="all">Посмотреть все элементы до 53</button>
</div>

<div id="list" class="scr"><div id="grid"></div>
  <div id="panel">
    <div class="top"><div class="big" id="sym"></div>
    <div><div class="lbl">Читается</div><div class="say" id="say"></div></div>
    <button class="sp" id="spk" aria-label="Озвучить">🔊</button></div>
    <div class="row"><span>Что означает (по-русски)</span><div id="nm"></div></div>
    <div class="row"><span>Валентность</span><div id="val"></div></div>
  </div>
</div>

<script>
// символ|название|как читается|валентность (в скобках — редкие)
const D=`H|Водород|аш|I
He|Гелий|гелий|0
Li|Литий|литий|I
Be|Бериллий|бериллий|II
B|Бор|бэ|III
C|Углерод|цэ|II, IV
N|Азот|эн|I, II, III, IV, V
O|Кислород|о|II
F|Фтор|фтор|I
Ne|Неон|неон|0
Na|Натрий|натрий|I
Mg|Магний|магний|II
Al|Алюминий|алюминий|III
Si|Кремний|силициум|II, IV
P|Фосфор|пэ|III, V
S|Сера|эс|II, IV, VI
Cl|Хлор|хлор|I, III, V, VII
Ar|Аргон|аргон|0
K|Калий|калий|I
Ca|Кальций|кальций|II
Sc|Скандий|скандий|I, III
Ti|Титан|титан|II, III, IV, V
V|Ванадий|вэ|II, III, IV, V
Cr|Хром|хром|II, III, VI
Mn|Марганец|марганец|II, III, IV, VI, VII
Fe|Железо|феррум|II, III, VI
Co|Кобальт|кобальт|II
Ni|Никель|никель|II
Cu|Медь|купрум|I, II
Zn|Цинк|цинк|II
Ga|Галлий|галлий|I, III
Ge|Германий|германий|II, IV
As|Мышьяк|арсеникум|III, V
Se|Селен|селен|II, IV, VI
Br|Бром|бром|I, III, V, VII
Kr|Криптон|криптон|0, (II)
Rb|Рубидий|рубидий|I
Sr|Стронций|стронций|II
Y|Иттрий|иттрий|III
Zr|Цирконий|цирконий|III, IV, V
Nb|Ниобий|ниобий|III, IV, V
Mo|Молибден|молибден|II, III, VI
Tc|Технеций|технеций|IV, VII
Ru|Рутений|рутений|II, III, IV, VI, VIII
Rh|Родий|родий|III
Pd|Палладий|палладий|II, IV
Ag|Серебро|аргентум|I
Cd|Кадмий|кадмий|II
In|Индий|индий|III
Sn|Олово|станнум|II, IV
Sb|Сурьма|стибиум|III, V
Te|Теллур|теллур|II, IV, VI
I|Иод|иод|I, III, V, VII`.split("\n").map(l=>l.split("|"));
const $=id=>document.getElementById(id);
function speak(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ru-RU";u.rate=.85;speechSynthesis.speak(u);}catch(x){}}
function show(id){["quiz","result","list"].forEach(s=>$(s).classList.toggle("on",s===id));
  $("bq").classList.toggle("on",id==="quiz"||id==="result");$("bl").classList.toggle("on",id==="list");}

// ---- тест ----
const N=7;let q=[],i=0,score=0,flipped=false;
function start(){
  const a=D.map((_,k)=>k);
  for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}
  q=a.slice(0,N);i=0;score=0;show("quiz");next0();
}
function next0(){
  flipped=false;$("card").classList.remove("f");
  const e=D[q[i]];$("front").textContent=e[0];
  $("prog").textContent="Элемент "+(i+1)+" из "+N;
  $("act").textContent="Не знаю";$("act").className="main alt";
  $("hint").style.visibility="visible";
}
function reveal(known){
  if(flipped)return;flipped=true;if(known)score++;
  const e=D[q[i]];
  $("bSay").textContent=e[2];$("bNm").textContent=e[1];$("bVal").textContent=e[3];
  $("card").classList.add("f");speak(e[2]);
  $("hint").style.visibility="hidden";
  $("act").textContent=i===N-1?"Узнать результат":"Дальше";$("act").className="main";
}
$("front").onclick=()=>reveal(true);
$("act").onclick=()=>{
  if(!flipped){reveal(false);return;}
  if(i<N-1){i++;next0();}else finish();
};
function finish(){
  $("score").textContent=score+" из "+N;
  $("msg").textContent=score===N?"Отлично, все верно!":score>=5?"Хороший результат!":score>=3?"Неплохо, можно лучше.":"Стоит повторить — загляните в список элементов.";
  show("result");
}
$("again").onclick=start;
$("bq").onclick=start;

// ---- список ----
const g=$("grid");let cur=null;
D.forEach((e,k)=>{const b=document.createElement("button");b.className="t";
  b.innerHTML="<small>"+(k+1)+"</small><b>"+e[0]+"</b>";
  b.onclick=()=>{document.querySelectorAll(".t.on").forEach(x=>x.classList.remove("on"));b.classList.add("on");cur=e;
    $("sym").textContent=e[0];$("say").textContent=e[2];$("nm").textContent=(k+1)+". "+e[1];$("val").textContent=e[3];
    $("panel").classList.add("on");speak(e[2]);};
  g.appendChild(b);});
$("spk").onclick=()=>{if(cur)speak(cur[2])};
function openList(){show("list");}
$("bl").onclick=openList;$("all").onclick=openList;

try{const w=window.Telegram&&window.Telegram.WebApp;if(w){w.ready();w.expand();}}catch(x){}
start();
</script>
</body>
</html>
